    url: http://nep.repec.org/rss/nep-mic.rss.xml
    venue: NEP Microeconomics
  - id: nep-lma
    type: rss
    parser: nep
    url: http://nep.repec.org/rss/nep-lma.rss.xml
    venue: NEP Labor Markets
  - id: nep-pbe
    type: rss
    parser: nep
    url: http://nep.repec.org/rss/nep-pbe.rss.xml
    venue: NEP Public Economics
  - id: nep-dge
    type: rss
    parser: nep
    url: http://nep.repec.org/rss/nep-dge.rss.xml
    venue: NEP Dynamic General Equilibrium
  - id: nep-gen
    type: rss
    parser: nep
    url: http://nep.repec.org/rss/nep-gen.rss.xml
    venue: NEP Gender
  - id: nep-ecm
    type: rss
    parser: nep
    url: http://nep.repec.org/rss/nep-ecm.rss.xml
    venue: NEP Econometrics
  - id: nep-ltv
    type: rss
    parser: nep
    url: http://nep.repec.org/rss/nep-ltv.rss.xml
    venue: NEP Unemployment, Inequality and Poverty
  # Keyword catch-all over everything OpenAlex indexes (RePEc series, SSRN, university
  # repositories, journals). Noisy by design; the screener sorts it out. Phrases are quoted.
  - id: openalex-keywords
    type: openalex_search
    venue: OpenAlex
    window_days: 30
    phrases:
      # examples; replace with ten to twenty phrases from your own field
      - minimum wage
      - monopsony
      - child penalty
      - intergenerational mobility
      - matched employer-employee

