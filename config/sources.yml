# Sources polled by `radar fetch`. Edit freely; ids must stay unique.
contact_email: you@example.org   # change me: sent as User-Agent / mailto to polite API pools

settings:
  lookback_days: 7          # how far back a first run (or a run after a gap) looks
  show_threshold: 6         # score needed to appear in the digest
  deep_read_threshold: 8    # score needed for a full-paper read
  max_deep_reads: 5         # per day, on top of papers you sent in yourself
  backend: claude_code      # claude_code = Claude Code headless under your subscription; api = ANTHROPIC_API_KEY
  # claude_bin: /path/to/claude   # auto-detected: PATH, then the Claude desktop app bundle
  llm_timeout: 300          # seconds per call (a screening call takes about 15 s)
  screen_model: claude-sonnet-5
  screen_effort: low
  screen_group_size: 12     # papers per screening call
  deep_read_model: claude-opus-5
  review_model: claude-opus-5
  digest_label: digest      # GitHub label put on digest issues
  paper_label: paper        # GitHub label put on processed intake issues
  timezone: Europe/Copenhagen

working_papers:
  - id: nber
    type: rss
    parser: nber
    url: https://back.nber.org/rss/new.xml
    venue: NBER
  - id: cepr
    type: rss
    parser: cepr
    url: https://cepr.org/rss/discussion-paper
    venue: CEPR
  - id: iza
    type: ideas_series
    url: https://ideas.repec.org/s/iza/izadps.html
    venue: IZA
  - id: arxiv
    type: arxiv
    categories: [econ.GN, econ.EM, econ.TH]
    venue: arXiv
  - id: nep-dem
    type: rss
    parser: nep
    url: http://nep.repec.org/rss/nep-dem.rss.xml
    venue: NEP Demographic Economics
  - id: nep-lab
    type: rss
    parser: nep
    url: http://nep.repec.org/rss/nep-lab.rss.xml
    venue: NEP Labour Economics
  - id: nep-mic
