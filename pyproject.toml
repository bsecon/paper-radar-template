[project]
name = "paper-radar"
version = "0.1.0"
description = "Daily radar for new economics working papers and journal articles, screened by Claude."
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "tzdata>=2026.6",
]

[project.optional-dependencies]
api = ["anthropic>=1.5.0"]   # only for backend: api

[project.scripts]
radar = "radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
